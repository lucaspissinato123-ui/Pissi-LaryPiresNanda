<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz de Biologia - 2º Ano</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #052e16, #166534, #22c55e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #172016;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .topo {
            text-align: center;
            margin-bottom: 25px;
        }

        .topo h1 {
            color: #166534;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .topo p {
            color: #64748b;
        }

        .placar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0fdf4;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #166534;
            font-weight: bold;
        }

        .progresso-container {
            height: 10px;
            background: #dcfce7;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progresso {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.4s;
        }

        .numero {
            color: #16a34a;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .pergunta {
            font-size: 23px;
            line-height: 1.4;
            margin-bottom: 25px;
            color: #1e293b;
        }

        .alternativas {
            display: grid;
            gap: 12px;
        }

        .alternativa {
            width: 100%;
            padding: 17px;
            border: 2px solid #e2e8f0;
            background: #fff;
            border-radius: 12px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .alternativa:hover {
            border-color: #22c55e;
            background: #f0fdf4;
            transform: translateX(4px);
        }

        .alternativa.correta {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .alternativa.errada {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .alternativa:disabled {
            cursor: default;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            line-height: 1.5;
        }

        .feedback.mostrar {
            display: block;
        }

        .feedback.certo {
            background: #dcfce7;
            color: #166534;
        }

        .feedback.errado {
            background: #fee2e2;
            color: #991b1b;
        }

        .botao {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .botao:hover {
            background: #15803d;
        }

        .resultado {
            display: none;
            text-align: center;
        }

        .resultado .emoji {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .resultado h2 {
            color: #166534;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .pontuacao-final {
            font-size: 42px;
            font-weight: bold;
            color: #16a34a;
            margin: 20px 0;
        }

        .mensagem-final {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .reiniciar {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
            }

            .topo h1 {
                font-size: 27px;
            }

            .pergunta {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="topo">
            <h1>🧬 Quiz de Biologia</h1>
            <p>2º Ano do Ensino Médio</p>
        </div>

        <div id="quiz">

            <div class="placar">
                <span>Questão <span id="numeroAtual">1</span></span>
                <span>Pontos: <span id="pontos">0</span></span>
            </div>

            <div class="progresso-container">
                <div class="progresso" id="progresso"></div>
            </div>

            <div class="numero" id="tema"></div>

            <h2 class="pergunta" id="pergunta"></h2>

            <div class="alternativas" id="alternativas"></div>

            <div class="feedback" id="feedback"></div>

            <button class="botao" id="proxima">
                Próxima questão →
            </button>

        </div>

        <div class="resultado" id="resultado">

            <div class="emoji" id="emojiResultado">🏆</div>

            <h2>Quiz finalizado!</h2>

            <p>Você conseguiu:</p>

            <div class="pontuacao-final">
                <span id="pontuacaoFinal">0</span>/10
            </div>

            <p class="mensagem-final" id="mensagemFinal"></p>

            <button class="botao reiniciar" id="reiniciar">
                🔄 Jogar novamente
            </button>

        </div>

    </div>

    <script>

        const perguntas = [

            {
                tema: "Genética",
                pergunta: "Qual molécula contém a maior parte das informações genéticas de um organismo?",
                alternativas: [
                    "DNA",
                    "ATP",
                    "Glicose",
                    "Lipídio"
                ],
                correta: 0,
                explicacao: "O DNA armazena a maior parte das informações genéticas dos organismos."
            },

            {
                tema: "Citologia",
                pergunta: "Qual organela é responsável principalmente pela produção de energia na célula por meio da respiração celular?",
                alternativas: [
                    "Ribossomo",
                    "Mitocôndria",
                    "Lisossomo",
                    "Complexo golgiense"
                ],
                correta: 1,
                explicacao: "As mitocôndrias realizam etapas importantes da respiração celular e produzem ATP."
            },

            {
                tema: "Evolução",
                pergunta: "Segundo a teoria da seleção natural, indivíduos com características mais favoráveis ao ambiente tendem a:",
                alternativas: [
                    "Desaparecer imediatamente",
                    "Ter maior sucesso reprodutivo",
                    "Modificar seu DNA conscientemente",
                    "Parar de sofrer mutações"
                ],
                correta: 1,
                explicacao: "Características que aumentam a sobrevivência ou reprodução podem tornar-se mais frequentes ao longo das gerações."
            },

            {
                tema: "Ecologia",
                pergunta: "Em uma cadeia alimentar, os organismos produtores são importantes porque:",
                alternativas: [
                    "Produzem seu próprio alimento",
                    "Alimentam-se apenas de outros animais",
                    "Decompõem todos os seres mortos",
                    "Não participam do fluxo de energia"
                ],
                correta: 0,
                explicacao: "Produtores, como plantas e algas, produzem matéria orgânica principalmente por fotossíntese."
            },

            {
                tema: "Fisiologia Humana",
                pergunta: "Qual sistema é responsável principalmente pelo transporte de oxigênio, nutrientes e hormônios pelo corpo?",
                alternativas: [
                    "Sistema nervoso",
                    "Sistema digestório",
                    "Sistema circulatório",
                    "Sistema esquelético"
                ],
                correta: 2,
                explicacao: "O sistema circulatório transporta sangue pelo organismo, distribuindo gases, nutrientes e outras substâncias."
            },

            {
                tema: "Genética",
                pergunta: "Quando dois alelos diferentes estão presentes para determinado gene, o indivíduo é chamado de:",
                alternativas: [
                    "Homozigoto",
                    "Heterozigoto",
                    "Haploide",
                    "Poliploide"
                ],
                correta: 1,
                explicacao: "Heterozigoto é o indivíduo que possui dois alelos diferentes para determinado gene."
            },

            {
                tema: "Ecologia",
                pergunta: "Como é chamado o conjunto de indivíduos da mesma espécie que vive em determinada área?",
                alternativas: [
                    "Comunidade",
                    "Ecossistema",
                    "População",
                    "Biosfera"
                ],
                correta: 2,
                explicacao: "População é o conjunto de indivíduos da mesma espécie que ocupa determinada área em um período."
            },

            {
                tema: "Fisiologia Humana",
                pergunta: "Qual hormônio produzido pelo pâncreas ajuda a diminuir a concentração de glicose no sangue?",
                alternativas: [
                    "Insulina",
                    "Adrenalina",
                    "Tiroxina",
                    "Melatonina"
                ],
                correta: 0,
                explicacao: "A insulina favorece a entrada e o armazenamento de glicose, contribuindo para reduzir sua concentração no sangue."
            },

            {
                tema: "Botânica",
                pergunta: "Qual pigmento está diretamente relacionado à absorção de luz para a fotossíntese?",
                alternativas: [
                    "Hemoglobina",
                    "Queratina",
                    "Clorofila",
                    "Melanina"
                ],
                correta: 2,
                explicacao: "A clorofila absorve energia luminosa e participa das etapas iniciais da fotossíntese."
            },

            {
                tema: "Ecologia",
                pergunta: "Qual processo realizado por fungos e muitas bactérias contribui para a decomposição da matéria orgânica?",
                alternativas: [
                    "Digestão extracelular",
                    "Fotossíntese",
                    "Quimiossíntese",
                    "Transpiração"
                ],
                correta: 0,
                explicacao: "Muitos decompositores realizam digestão extracelular, liberando enzimas sobre a matéria orgânica."
            }

        ];

        let perguntaAtual = 0;
        let pontos = 0;
        let respondeu = false;

        const perguntaElemento = document.getElementById("pergunta");
        const alternativasElemento = document.getElementById("alternativas");
        const feedbackElemento = document.getElementById("feedback");
        const proximaBotao = document.getElementById("proxima");
        const numeroAtual = document.getElementById("numeroAtual");
        const pontosElemento = document.getElementById("pontos");
        const progresso = document.getElementById("progresso");
        const tema = document.getElementById("tema");

        function carregarPergunta() {

            respondeu = false;

            const atual = perguntas[perguntaAtual];

            numeroAtual.textContent = perguntaAtual + 1;
            pontosElemento.textContent = pontos;

            tema.textContent = "Tema: " + atual.tema;

            perguntaElemento.textContent = atual.pergunta;

            alternativasElemento.innerHTML = "";

            feedbackElemento.className = "feedback";
            feedbackElemento.innerHTML = "";

            proximaBotao.style.display = "none";

            const porcentagem =
                (perguntaAtual / perguntas.length) * 100;

            progresso.style.width = porcentagem + "%";

            atual.alternativas.forEach((alternativa, indice) => {

                const botao = document.createElement("button");

                botao.className = "alternativa";
                botao.textContent = alternativa;

                botao.addEventListener("click", () => {
                    verificarResposta(indice);
                });

                alternativasElemento.appendChild(botao);
            });
        }

        function verificarResposta(indice) {

            if (respondeu) return;

            respondeu = true;

            const atual = perguntas[perguntaAtual];
            const botoes =
                document.querySelectorAll(".alternativa");

            botoes.forEach(botao => {
                botao.disabled = true;
            });

            if (indice === atual.correta) {

                pontos++;

                pontosElemento.textContent = pontos;

                botoes[indice].classList.add("correta");

                feedbackElemento.className =
                    "feedback mostrar certo";

                feedbackElemento.innerHTML =
                    "✅ <strong>Resposta correta!</strong><br>" +
                    atual.explicacao;

            } else {

                botoes[indice].classList.add("errada");

                botoes[atual.correta].classList.add("correta");

                feedbackElemento.className =
                    "feedback mostrar errado";

                feedbackElemento.innerHTML =
                    "❌ <strong>Resposta incorreta.</strong><br>" +
                    "A resposta correta é: <strong>" +
                    atual.alternativas[atual.correta] +
                    "</strong>.<br>" +
                    atual.explicacao;
            }

            proximaBotao.style.display = "block";
        }

        proximaBotao.addEventListener("click", () => {

            perguntaAtual++;

            if (perguntaAtual < perguntas.length) {

                carregarPergunta();

            } else {

                mostrarResultado();

            }
        });

        function mostrarResultado() {

            document.getElementById("quiz").style.display = "none";

            const resultado =
                document.getElementById("resultado");

            resultado.style.display = "block";

            document.getElementById("pontuacaoFinal")
                .textContent = pontos;

            let mensagem = "";
            let emoji = "📚";

            if (pontos === 10) {

                mensagem =
                    "Excelente! Você domina muito bem os conteúdos de Biologia.";
                emoji = "🏆";

            } else if (pontos >= 7) {

                mensagem =
                    "Muito bom! Você tem um ótimo conhecimento de Biologia.";
                emoji = "🧬";

            } else if (pontos >= 5) {

                mensagem =
                    "Bom trabalho! Continue estudando para melhorar ainda mais.";
                emoji = "🔬";

            } else {

                mensagem =
                    "Continue estudando! Revise os conteúdos e tente novamente.";
                emoji = "📖";
            }

            document.getElementById("mensagemFinal")
                .textContent = mensagem;

            document.getElementById("emojiResultado")
                .textContent = emoji;

            document.querySelector(".reiniciar")
                .style.display = "block";
        }

        document.getElementById("reiniciar")
            .addEventListener("click", () => {

                perguntaAtual = 0;
                pontos = 0;

                document.getElementById("resultado")
                    .style.display = "none";

                document.getElementById("quiz")
                    .style.display = "block";

                carregarPergunta();
            });

        carregarPergunta();

    </script>

</body>
</html>
